<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Dokument-Scanner</title><style>
body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}header{background:#111827;color:white;padding:17px;font-size:21px;font-weight:800}main{max-width:700px;margin:auto;padding:14px}.card{background:white;padding:17px;border-radius:15px;margin-bottom:14px}.actionbtn{display:block;width:100%;text-align:center;border-radius:10px;font-weight:800;cursor:pointer;margin:8px 0;border:0}.scan{background:#2563eb;color:white;padding:17px}.pick{background:#e5e7eb;color:#111827;padding:13px}.page{border:1px solid #ddd;border-radius:10px;padding:8px;margin:10px 0}.page img,#report img{width:100%;max-height:700px;object-fit:contain}button{border:0;border-radius:9px;padding:11px 14px;font-weight:800;margin:7px 5px 0 0}.blue{background:#2563eb;color:white}.gray{background:#e5e7eb}.red{background:#fee2e2;color:#b91c1c}.small{color:#6b7280;font-size:13px}.ok{color:#047857}.warn{color:#b45309}#report{display:none}@media print{header,#scan,#report button{display:none!important}body,main{background:white;margin:0;padding:0}#report{display:block!important}.rp{page-break-after:always}.rp:last-child{page-break-after:auto}#report img{max-height:270mm}}
</style></head><body><header>Dokument-Scanner</header><main><section id="scan" class="card"><h2>Dokument scannen</h2><p class="small">Seite fotografieren. Wenn die Blattkanten erkannt werden, wird der Hintergrund automatisch entfernt und die Perspektive begradigt.</p>
<button id="cameraBtn" type="button" class="actionbtn scan">📷 Jetzt fotografieren</button>
<button id="galleryBtn" type="button" class="actionbtn pick">🖼️ Bild aus Galerie auswählen</button>
<input id="cam" type="file" accept="image/*" capture="environment" style="position:fixed;left:-9999px;top:-9999px" aria-label="Jetzt fotografieren">
<input id="gallery" type="file" accept="image/*" multiple style="position:fixed;left:-9999px;top:-9999px" aria-label="Bild aus Galerie auswählen">
<p id="status" class="small">Bereit. Die Seitenerkennung wird erst nach dem Foto geladen.</p><div id="pages"></div><button id="pdf" class="blue">📄 PDF erstellen</button><button id="clear" class="gray">Alle löschen</button></section><section id="report" class="card"><div id="rp"></div><button class="blue" onclick="window.print()">Teilen / als PDF sichern</button><button class="gray" onclick="document.getElementById('report').style.display='none'">Zurück</button></section></main>
<script>
const $=x=>document.getElementById(x);let pages=[];let cvReady=false;let cvFailed=false;
function setStatus(t,c=''){const e=$('status');e.textContent=t;e.className='small '+c}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function orderPoints(pts){const sum=p=>p.x+p.y,diff=p=>p.y-p.x;return [pts.reduce((a,b)=>sum(a)<sum(b)?a:b),pts.reduce((a,b)=>diff(a)<diff(b)?a:b),pts.reduce((a,b)=>sum(a)>sum(b)?a:b),pts.reduce((a,b)=>diff(a)>diff(b)?a:b)]}
function matPoints(approx){const pts=[];for(let i=0;i<4;i++)pts.push({x:approx.intPtr(i,0)[0],y:approx.intPtr(i,0)[1]});return orderPoints(pts)}
function waitForCv(ms=4500){if(cvReady||cvFailed)return Promise.resolve(cvReady);return new Promise(resolve=>{const started=Date.now();const timer=setInterval(()=>{if(cvReady||cvFailed||Date.now()-started>=ms){clearInterval(timer);resolve(cvReady)}},100)})}
async function initOpenCv(){
 try{
   if(!window.cv){cvFailed=true;setStatus('Automatischer Zuschnitt nicht verfügbar – Fotos funktionieren trotzdem.','warn');return}
   if(typeof window.cv.then==='function') window.cv=await window.cv;
   if(window.cv && window.cv.Mat){cvReady=true;setStatus('Bereit – Kamera und automatischer Zuschnitt funktionieren.','ok');return}
   window.cv.onRuntimeInitialized=()=>{cvReady=true;setStatus('Bereit – Kamera und automatischer Zuschnitt funktionieren.','ok')};
 }catch(e){cvFailed=true;setStatus('Automatischer Zuschnitt nicht verfügbar – Fotos funktionieren trotzdem.','warn')}
}
let cvLoadStarted=false;
function loadOpenCv(){
 if(cvReady||cvFailed||cvLoadStarted)return;
 cvLoadStarted=true;
 setStatus('Foto aufgenommen – Seitenerkennung wird geladen …');
 const s=document.createElement('script');
 s.src='https://docs.opencv.org/4.x/opencv.js';
 s.async=true;
 s.onload=initOpenCv;
 s.onerror=()=>{cvFailed=true;setStatus('Automatischer Zuschnitt konnte nicht geladen werden – das Foto wird trotzdem übernommen.','warn')};
 document.head.appendChild(s)
}
async function decodeImage(file){
 if('createImageBitmap' in window){try{const b=await createImageBitmap(file);return {img:b,w:b.width,h:b.height,cleanup:()=>{try{b.close()}catch(e){}}}}catch(e){}}
 return await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>resolve({img,w:img.naturalWidth,h:img.naturalHeight,cleanup:()=>URL.revokeObjectURL(url)});img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Bild konnte nicht geöffnet werden'))};img.src=url})
}
function resizeCanvas(source,maxSide=1800,quality=.86){const s=Math.min(1,maxSide/Math.max(source.width,source.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(source.width*s));c.height=Math.max(1,Math.round(source.height*s));c.getContext('2d').drawImage(source,0,0,c.width,c.height);return c.toDataURL('image/jpeg',quality)}
async function comp(file){
 let decoded;
 try{
  decoded=await decodeImage(file);const detectScale=Math.min(1,1400/Math.max(decoded.w,decoded.h));const dc=document.createElement('canvas');dc.width=Math.max(1,Math.round(decoded.w*detectScale));dc.height=Math.max(1,Math.round(decoded.h*detectScale));dc.getContext('2d').drawImage(decoded.img,0,0,dc.width,dc.height);decoded.cleanup();decoded=null;
  if(!cvReady && !cvFailed){loadOpenCv(); await waitForCv(7000);}
  if(!cvReady) return resizeCanvas(dc);
  let src=null,gray=null,blur=null,edges=null,contours=null,hierarchy=null,best=null;
  try{
   src=cv.imread(dc);gray=new cv.Mat();blur=new cv.Mat();edges=new cv.Mat();contours=new cv.MatVector();hierarchy=new cv.Mat();
   cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);cv.Canny(blur,edges,55,160);
   const kernel=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(5,5));cv.morphologyEx(edges,edges,cv.MORPH_CLOSE,kernel);kernel.delete();
   cv.findContours(edges,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);let bestArea=0,minArea=dc.width*dc.height*.18;
   for(let i=0;i<contours.size();i++){const cnt=contours.get(i),peri=cv.arcLength(cnt,true),approx=new cv.Mat();cv.approxPolyDP(cnt,approx,.02*peri,true);const area=Math.abs(cv.contourArea(approx));if(approx.rows===4&&area>minArea&&area>bestArea){bestArea=area;if(best)best.delete();best=approx.clone()}approx.delete();cnt.delete()}
   if(!best)return resizeCanvas(dc);
   const [tl,tr,br,bl]=matPoints(best);let w=Math.round(Math.max(dist(br,bl),dist(tr,tl))),h=Math.round(Math.max(dist(tr,br),dist(tl,bl)));if(w<100||h<100)return resizeCanvas(dc);
   const outScale=Math.min(1,1800/Math.max(w,h));w=Math.max(1,Math.round(w*outScale));h=Math.max(1,Math.round(h*outScale));
   const from=cv.matFromArray(4,1,cv.CV_32FC2,[tl.x,tl.y,tr.x,tr.y,br.x,br.y,bl.x,bl.y]),to=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,w-1,0,w-1,h-1,0,h-1]);const M=cv.getPerspectiveTransform(from,to),dst=new cv.Mat();cv.warpPerspective(src,dst,M,new cv.Size(w,h),cv.INTER_LINEAR,cv.BORDER_REPLICATE);const out=document.createElement('canvas');out.width=w;out.height=h;cv.imshow(out,dst);from.delete();to.delete();M.delete();dst.delete();return out.toDataURL('image/jpeg',.88)
  }catch(err){console.warn('Zuschnitt fehlgeschlagen, Original wird verwendet:',err);return resizeCanvas(dc)}finally{[src,gray,blur,edges,contours,hierarchy,best].forEach(x=>{try{x&&x.delete()}catch(e){}})}
 }catch(err){if(decoded)try{decoded.cleanup()}catch(e){};throw err}
}
async function handleFiles(files){const fs=[...files].slice(0,20);if(!fs.length)return;setStatus(`Verarbeite ${fs.length} Seite${fs.length===1?'':'n'} …`);let added=0;for(const f of fs){try{pages.push(await comp(f));added++;render()}catch(err){console.error(err);alert('Dieses Foto konnte leider nicht verarbeitet werden. Bitte versuche es erneut.')}}setStatus(added?`Fertig – ${added} Seite${added===1?'':'n'} hinzugefügt.`:'Kein Foto hinzugefügt.',added?'ok':'warn')}
$('cameraBtn').addEventListener('click',()=>{
  setStatus('Kamera wird geöffnet …');
  $('cam').click();
});
$('galleryBtn').addEventListener('click',()=>{
  setStatus('Fotoauswahl wird geöffnet …');
  $('gallery').click();
});
$('cam').addEventListener('change',async e=>{const files=e.target.files;if(!files||!files.length){setStatus('Bereit.');return}await handleFiles(files);e.target.value=''})
$('gallery').addEventListener('change',async e=>{const files=e.target.files;if(!files||!files.length){setStatus('Bereit.');return}await handleFiles(files);e.target.value=''})
function render(){$('pages').innerHTML=pages.length?pages.map((p,i)=>`<div class="page"><b>Seite ${i+1}</b><img src="${p}"><button class="red" onclick="pages.splice(${i},1);render()">Löschen</button>${i?`<button class="gray" onclick="move(${i},-1)">↑</button>`:''}${i<pages.length-1?`<button class="gray" onclick="move(${i},1)">↓</button>`:''}</div>`).join(''):'<p class="small">Noch keine Seiten gescannt.</p>'}
window.move=(i,d)=>{const x=pages.splice(i,1)[0];pages.splice(i+d,0,x);render()};$('clear').onclick=()=>{pages=[];render()};$('pdf').onclick=()=>{if(!pages.length)return alert('Bitte zuerst eine Seite scannen.');$('rp').innerHTML=pages.map(p=>`<div class="rp"><img src="${p}"></div>`).join('');$('report').style.display='block';$('report').scrollIntoView()};render();
</script></body></html>
