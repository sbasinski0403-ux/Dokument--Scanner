<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Dokument-Scanner</title><style>
body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}header{background:#111827;color:white;padding:17px;font-size:21px;font-weight:800}main{max-width:700px;margin:auto;padding:14px}.card{background:white;padding:17px;border-radius:15px;margin-bottom:14px}.actionbtn{display:block;width:100%;text-align:center;border-radius:10px;font-weight:800;cursor:pointer;margin:8px 0;border:0}.scan{background:#2563eb;color:white;padding:17px}.pick{background:#e5e7eb;color:#111827;padding:13px}.page{border:1px solid #ddd;border-radius:10px;padding:8px;margin:10px 0}.page img,#report img{width:100%;max-height:700px;object-fit:contain}button{border:0;border-radius:9px;padding:11px 14px;font-weight:800;margin:7px 5px 0 0}.blue{background:#2563eb;color:white}.gray{background:#e5e7eb}.red{background:#fee2e2;color:#b91c1c}.small{color:#6b7280;font-size:13px}.cameraBox{display:none;position:relative;margin:12px 0;padding:10px 10px 92px;background:#0f172a;border-radius:12px}.cameraBox video{width:100%;max-height:68vh;object-fit:cover;border-radius:10px;background:#000}.cameraControls{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px}.cameraControls button{flex:1;min-width:0}.cameraControls #captureBtn{font-size:18px;padding:16px 12px}.ok{color:#047857}.warn{color:#b45309}#report{display:none}@media print{header,#scan,#report button{display:none!important}body,main{background:white;margin:0;padding:0}#report{display:block!important}.rp{page-break-after:always}.rp:last-child{page-break-after:auto}#report img{max-height:270mm}}
</style></head><body><header>Dokument-Scanner</header><main><section id="scan" class="card"><h2>Dokument scannen</h2><p class="small">Foto aufnehmen. Die Seite wird sofort übernommen und der Hintergrund anschließend automatisch zugeschnitten.</p>
<button id="cameraBtn" type="button" class="actionbtn scan">📷 Kamera öffnen</button>
<div id="cameraBox" class="cameraBox"><video id="cameraVideo" autoplay muted playsinline></video><div class="cameraControls"><button id="captureBtn" type="button" class="blue">📸 Foto aufnehmen</button><button id="closeCameraBtn" type="button" class="gray">Schließen</button></div></div>
<button id="galleryBtn" type="button" class="actionbtn pick">🖼️ Bild aus Galerie auswählen</button><input id="gallery" type="file" accept="image/*" multiple style="position:fixed;left:-9999px;top:-9999px">
<p id="status" class="small">Bereit.</p><div id="pages"></div><button id="pdf" class="blue">📄 PDF erstellen</button><button id="clear" class="gray">Alle löschen</button></section><section id="report" class="card"><div id="rp"></div><button class="blue" onclick="window.print()">Teilen / als PDF sichern</button><button class="gray" onclick="document.getElementById('report').style.display='none'">Zurück</button></section></main>
<script>
const $=id=>document.getElementById(id);let pages=[];let cameraStream=null;
function setStatus(t,c=''){const e=$('status');e.textContent=t;e.className='small '+c}
function render(){$('pages').innerHTML=pages.length?pages.map((p,i)=>`<div class="page"><b>Seite ${i+1}</b><img src="${p}"><div><button class="red" onclick="pages.splice(${i},1);render()">Löschen</button>${i?`<button class="gray" onclick="move(${i},-1)">↑</button>`:''}${i<pages.length-1?`<button class="gray" onclick="move(${i},1)">↓</button>`:''}</div></div>`).join(''):'<p class="small">Noch keine Seiten gescannt.</p>'}
window.move=(i,d)=>{const x=pages.splice(i,1)[0];pages.splice(i+d,0,x);render()};
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}const v=$('cameraVideo');try{v.pause()}catch{}v.srcObject=null;$('cameraBox').style.display='none'}
async function openCamera(){if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){alert('Bitte die veröffentlichte HTTPS-Seite auf github.io öffnen.');return}try{stopCamera();setStatus('Kamera wird geöffnet …');cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});const v=$('cameraVideo');v.srcObject=cameraStream;await v.play();$('cameraBox').style.display='block';$('cameraBox').scrollIntoView({behavior:'smooth',block:'start'});setStatus('Kamera bereit.','ok')}catch(e){console.error(e);setStatus('Kamera konnte nicht geöffnet werden.','warn');alert('Kamera konnte nicht geöffnet werden. Prüfe die Kamera-Berechtigung für diese Webseite.');stopCamera()}}
function canvasToDataURL(c,q=.9){return c.toDataURL('image/jpeg',q)}
function fastAutoCrop(source){
  const max=420, s=Math.min(1,max/Math.max(source.width,source.height));
  const sm=document.createElement('canvas');sm.width=Math.max(1,Math.round(source.width*s));sm.height=Math.max(1,Math.round(source.height*s));const sx=sm.getContext('2d',{willReadFrequently:true});sx.drawImage(source,0,0,sm.width,sm.height);
  const im=sx.getImageData(0,0,sm.width,sm.height),d=im.data,w=sm.width,h=sm.height;
  const hist=new Array(256).fill(0);for(let i=0;i<d.length;i+=4){const y=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;hist[y|0]++}
  let total=w*h,sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sumB=0,wB=0,maxV=0,thr=180;for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=total-wB;if(!wF)break;sumB+=t*hist[t];const mB=sumB/wB,mF=(sum-sumB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>maxV){maxV=v;thr=t}}
  thr=Math.max(135,Math.min(220,thr));
  const row=new Array(h).fill(0),col=new Array(w).fill(0);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const lum=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;if(lum>thr){row[y]++;col[x]++}}
  const rowMin=w*.18,colMin=h*.18;let top=0,bottom=h-1,left=0,right=w-1;while(top<h&&row[top]<rowMin)top++;while(bottom>top&&row[bottom]<rowMin)bottom--;while(left<w&&col[left]<colMin)left++;while(right>left&&col[right]<colMin)right--;
  if(right-left<w*.35||bottom-top<h*.35)return canvasToDataURL(source,.9);
  const pad=Math.round(Math.min(w,h)*.015);left=Math.max(0,left-pad);top=Math.max(0,top-pad);right=Math.min(w-1,right+pad);bottom=Math.min(h-1,bottom+pad);
  const scale=1/s, x=Math.round(left*scale),y=Math.round(top*scale),cw=Math.round((right-left+1)*scale),ch=Math.round((bottom-top+1)*scale);
  const out=document.createElement('canvas');const maxOut=1800,os=Math.min(1,maxOut/Math.max(cw,ch));out.width=Math.max(1,Math.round(cw*os));out.height=Math.max(1,Math.round(ch*os));out.getContext('2d').drawImage(source,x,y,cw,ch,0,0,out.width,out.height);return canvasToDataURL(out,.9)
}
async function addCanvas(c){
  const idx=pages.length;pages.push(canvasToDataURL(c,.88));render();setStatus('Foto übernommen. Automatischer Zuschnitt läuft …');
  await new Promise(r=>setTimeout(r,60));
  try{pages[idx]=fastAutoCrop(c);render();setStatus('Fertig – Seite zugeschnitten.','ok')}catch(e){console.error(e);setStatus('Foto übernommen. Zuschnitt war nicht möglich.','warn')}
}
async function captureCamera(){const v=$('cameraVideo');if(!cameraStream||!v.videoWidth||!v.videoHeight){setStatus('Kamera ist noch nicht bereit.','warn');return}const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0,c.width,c.height);stopCamera();setStatus('Foto aufgenommen.');$('cameraBtn').scrollIntoView({behavior:'smooth',block:'start'});await addCanvas(c)}
async function fileToCanvas(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const max=2200,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}finally{URL.revokeObjectURL(url)}}
$('cameraBtn').onclick=openCamera;$('captureBtn').onclick=captureCamera;$('closeCameraBtn').onclick=()=>{stopCamera();setStatus('Kamera geschlossen.')};$('galleryBtn').onclick=()=>$('gallery').click();$('gallery').onchange=async e=>{const fs=[...e.target.files].slice(0,20);for(const f of fs){try{await addCanvas(await fileToCanvas(f))}catch(err){console.error(err)}}e.target.value=''};$('clear').onclick=()=>{pages=[];render();setStatus('Alle Seiten gelöscht.')};$('pdf').onclick=()=>{if(!pages.length)return alert('Bitte zuerst eine Seite scannen.');$('rp').innerHTML=pages.map(p=>`<div class="rp"><img src="${p}"></div>`).join('');$('report').style.display='block';$('report').scrollIntoView()};window.addEventListener('pagehide',stopCamera);render();
</script></body></html>
