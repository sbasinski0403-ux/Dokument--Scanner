<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Dokument-Scanner</title><style>
body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}header{background:#111827;color:#fff;padding:17px;font-size:21px;font-weight:800}main{max-width:700px;margin:auto;padding:14px}.card{background:#fff;padding:17px;border-radius:15px;margin-bottom:14px}.action{display:block;width:100%;border:0;border-radius:10px;font-weight:800;padding:16px;margin:8px 0}.blue{background:#2563eb;color:#fff}.gray{background:#e5e7eb;color:#111827}.red{background:#fee2e2;color:#b91c1c}.small{color:#6b7280;font-size:14px}.cameraBox{display:none;margin:12px 0;background:#0f172a;border-radius:12px;padding:10px}.cameraBox video{display:block;width:100%;max-height:60vh;object-fit:cover;border-radius:10px;background:#000}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.controls button{border:0;border-radius:10px;padding:16px 8px;font-size:17px;font-weight:800}.page{border:1px solid #ddd;border-radius:10px;padding:8px;margin:12px 0}.page img{display:block;width:100%;height:auto;border-radius:8px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700;font-size:12px}
</style></head><body><header>Dokument-Scanner – Test v9</header><main><section class="card"><h2>Kamera-Test</h2><p class="small">Diese Version macht absichtlich <b>keinen automatischen Zuschnitt</b>. Wir prüfen nur, ob ein Foto zuverlässig aufgenommen und angezeigt werden kann.</p>
<button id="cameraBtn" class="action blue" type="button">📷 Kamera öffnen</button>
<div id="cameraBox" class="cameraBox"><video id="video" autoplay muted playsinline></video><div class="controls"><button id="captureBtn" class="blue" type="button">📸 Foto aufnehmen</button><button id="closeBtn" class="gray" type="button">Kamera schließen</button></div></div>
<p id="status" class="small">Bereit.</p><div id="pages"></div></section></main><script>
const $=id=>document.getElementById(id);let stream=null,pages=[];
function status(t){$('status').textContent=t}
function render(){ $('pages').innerHTML=pages.length?pages.map((src,i)=>`<div class="page"><span class="badge">Foto ${i+1}</span><img src="${src}" alt="Aufgenommenes Dokument"><button class="action red" type="button" onclick="removePage(${i})">Löschen</button></div>`).join(''):'<p class="small">Noch kein Foto aufgenommen.</p>' }
window.removePage=i=>{pages.splice(i,1);render()}
function closeCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;const v=$('video');try{v.pause()}catch(e){}v.srcObject=null;$('cameraBox').style.display='none';status('Kamera geschlossen.')}
async function openCamera(){try{status('Kamera wird geöffnet …');if(stream)closeCamera();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});const v=$('video');v.srcObject=stream;$('cameraBox').style.display='block';await v.play();status('Kamera bereit. Tippe auf „Foto aufnehmen“.');}catch(e){console.error(e);status('Kamera konnte nicht geöffnet werden.');alert('Kamera konnte nicht geöffnet werden.')}}
function capture(){const v=$('video');if(!stream||!v.videoWidth||!v.videoHeight){status('Kamera ist noch nicht bereit.');return}const b=$('captureBtn');b.disabled=true;status('Foto wird aufgenommen …');try{const max=1280;const scale=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(v.videoWidth*scale));c.height=Math.max(1,Math.round(v.videoHeight*scale));const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',0.78);pages.push(data);render();status('✅ Foto aufgenommen. Die Kamera bleibt offen.');$('pages').scrollIntoView({block:'start'});}catch(e){console.error(e);status('Fehler beim Aufnehmen des Fotos.');alert('Foto konnte nicht übernommen werden.')}finally{b.disabled=false}}
$('cameraBtn').onclick=openCamera;$('captureBtn').onclick=capture;$('closeBtn').onclick=closeCamera;window.addEventListener('pagehide',closeCamera);render();
</script></body></html>
